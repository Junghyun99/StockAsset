name: Run Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: '시작 날짜 (예: 2015-01-01)'
        required: true
        type: string
      end:
        description: '종료 날짜 (예: 2023-12-31)'
        required: true
        type: string
      initial_cash:
        description: '초기 자본 (기본값: 10000)'
        required: false
        type: string
        default: '10000'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backtest
      env:
        BACKTEST_START: ${{ inputs.start }}
        BACKTEST_END: ${{ inputs.end }}
        BACKTEST_CASH: ${{ inputs.initial_cash }}
      run: python scripts/run_backtest_ci.py

    - name: Upload backtest artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backtest-results-${{ inputs.start }}-${{ inputs.end }}
        path: |
          logs/backtest/
          docs/backtest_*.png
        retention-days: 30
