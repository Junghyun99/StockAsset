name: Run Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: '시작 날짜 (예: 2015-01-01)'
        required: true
        type: string
      end:
        description: '종료 날짜 (예: 2023-12-31)'
        required: true
        type: string
      initial_cash:
        description: '초기 자본 (기본값: 10000)'
        required: false
        type: string
        default: '10000'
      interval:
        description: '실행 간격 - 거래일 기준 (기본값: 1, 예: 5 = 5거래일마다 실행)'
        required: false
        type: string
        default: '1'
      engine:
        description: '백테스트 엔진 선택 (TradingEngine: 변동성 기반 노출도 조절 / FullExposureEngine: 항상 100% 노출 / QldSHVEngine: QLD+SHV 전략 / QldSchdEngine: QLD+SCHD 전략)'
        required: false
        type: choice
        options:
          - TradingEngine
          - FullExposureEngine
          - QldSHVEngine
          - QldSchdEngine
        default: 'TradingEngine'

permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backtest
      env:
        BACKTEST_START: ${{ inputs.start }}
        BACKTEST_END: ${{ inputs.end }}
        BACKTEST_CASH: ${{ inputs.initial_cash }}
        BACKTEST_INTERVAL: ${{ inputs.interval }}
        BACKTEST_ENGINE: ${{ inputs.engine }}
      run: python scripts/run_backtest_ci.py

    - name: Commit and Push Backtest Results
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 백테스트 결과 업데이트 [skip ci]"
        file_pattern: "docs/data/backtest/* logs/backtest/*"

    - name: Print backtest log
      if: always()
      run: |
        LOG_FILE=$(ls logs/backtest/*.log 2>/dev/null | head -1)
        if [ -n "$LOG_FILE" ]; then
          echo "=== 백테스트 로그: $LOG_FILE ==="
          cat "$LOG_FILE"
        else
          echo "로그 파일이 생성되지 않았습니다."
        fi

    - name: Upload backtest artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backtest-results-${{ inputs.start }}-${{ inputs.end }}
        path: |
          logs/backtest/
          docs/data/backtest/backtest_*.png
        retention-days: 30
