name: Python Unit Test

# 언제 실행할지 정의 (main 브랜치에 push되거나 PR이 올 때)
on:
  push:
    branches: [ "main" ] # "master"를 쓴다면 여기를 수정하세요
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # 우분투 최신 환경에서 실행

    steps:
    # 1. GitHub 저장소의 코드를 내려받음
    - uses: actions/checkout@v3

    # 2. 파이썬 설치 및 버전 설정
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10" # 프로젝트에 맞는 버전으로 변경 가능

    # 3. 의존성 패키지 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        pip install -r requirements.txt;

    # 4. pytest 실행
    - name: Test with pytest
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80 tests/ --ignore=tests/test_infra_broker_kis_domestic_live.py --ignore=tests/test_infra_data_live.py

    # 5. 대시보드(프론트엔드) 테스트 - node 내장 러너, 외부 의존성 없음
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # glob은 따옴표 없이 쉘이 확장한다. `node --test`가 glob 인자를 직접 해석하는 건
    # Node 22+ 기능이라, 따옴표로 감싸면 구버전 러너에서 리터럴 경로로 넘어가 실패한다.
    - name: Test dashboard modules
      run: node --test tests/dashboard/*.test.mjs

    - name: Slack Notification on Failure
      uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        author_name: GitHub Actions Test Fail
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_TEST }} # 아까 등록한 시크릿 사용
      if: failure() # 중요: 앞 단계가 실패했을 때만 실행됨
